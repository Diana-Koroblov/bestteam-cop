# Private, local-only settings for the COP peer.
#
# This file is NOT part of the negotiated contract and is NOT hashed for the
# M#11 digest exchange. Anything the opponent must agree to belongs in
# game.json instead.
#
# game.json is layered on top of this file at load time, so a value here can
# fill a gap but can never override something both teams agreed on.
#
# Secrets never live here. API keys and OAuth material go in .env
# (see .env-example) and credentials.json stays outside the repository.

version = "1.00"

[identity]
team_name = "bestteam"
# Both group members, by name. Declared in the Step-0 handshake and filed into
# `declaration_<game_id>.json`, which Ch. 9.3.3 requires to name "the identity
# of both groups and their members" — the opponent's half arrives the same way.
# ⚠️ VERIFY THESE AGAINST THE MOODLE SUBMISSION before a graded match. A name
# spelled differently here than in the form is an attribution problem for a
# grader joining two reports to one group (M#45).
members = ["Itay Malich", "Diana Koroblov"]
# Our two submitted repositories. Declared in Step-0 and filed into BOTH the
# declaration and the closing result, which Ch. 9.4 requires to carry four links
# — our two and the opponent's two (M#49). They were empty strings in every
# artefact until now, and could not have been filled in: the URLs existed only
# in README prose and nothing exchanged them.
repo_cop = "https://github.com/Diana-Koroblov/bestteam-cop"
repo_thief = "https://github.com/Diana-Koroblov/bestteam-thief"
role = "cop"
# Free-text, sent in the handshake. Keep it boring; it is public.
contact_label = "bestteam-cop"

# --- C-00x pairing terms: agreed in the thread, NOT contract keys ------------
# These six values used to live in the shared `game.json`. imreeyal's counted
# checklist (item 9) is that the FILED config artefact must be the shared
# contract in its 9-key shape, and that our C-00x mechanism choices bind as
# **pairing terms agreed in writing** rather than as keys inside that file. They
# were right, and their file never carried them: our contract was theirs plus
# these, which is why our canonical digest read 17606f14 against their cca1243e
# over content that differed in no rule at all.
#
# ⚠️ **THEY ARE HERE, NOT DELETED, AND THE DIFFERENCE IS THE WHOLE POINT.**
# Private config is the base and `game.json` is the overlay (config_manager
# §"merged with the shared file on top"), so a key absent from the contract is
# still resolved from here. Deleting them outright does three things, all bad:
#
#   * `core/domain/rules.py` calls `config.require()` on all three `capture`
#     keys — a missing key raises, and a peer that cannot build its rules engine
#     is a technical loss worth 0 to BOTH teams;
#   * `pheromones.decay_model` is read as `get(..., "multiplicative")` in
#     `core/crypto/scent_model.py` and `core/compat/session.py`. Absent, it
#     silently becomes the model we did **not** agree — blurring our own belief
#     filter exactly as it was blurred before 16/08, and changing the
#     `scent_model_sha256` we seal into every step-0 declaration;
#   * `seal_scent_digest` and `seal_barrier_cell` are read as `get(..., False)`,
#     so absent they silently stop sealing and our commitment shape changes
#     under an opponent auditing against the old one.
#
# Changing any value here changes what we PLAY without changing the digest we
# publish. That is exactly the desynchronisation the `[game]` comment below
# warns about, so treat these as frozen by the thread, not as local preferences.
#
# `version` is NOT repeated here: it is already declared at the top of this file,
# which is where `load_config` now falls back to when the 9-key contract omits it.

[capture]
# N15 / C-006b, N14 / C-006a, N16 / C-006c. Appendix F defines no capture table
# at all, which is why these are pairing terms rather than contract keys.
resolution = "after_moves"
stay_counts_as_move = false
swap_is_capture = false

[movement_and_barriers]
# N20 / C-018. Presence, not value, is the signal: a turn without a barrier
# hashes byte-identically whether or not either peer implements this.
seal_barrier_cell = true

[pheromones]
# N13b / C-007. SUBTRACTIVE is what we agreed with imreeyal and what is bound by
# scent_model_sha256 81ebee59 in every step-0 declaration — a digest THIS KEY
# feeds, so it is not an independent pin on itself.
decay_model = "subtractive"
# N13 / C-005 and N13c / C-008.
field_includes_current_turn = true
seal_scent_digest = true

[game]
# Local run settings only. The negotiated physics — grid size, move set,
# barrier count, scoring — deliberately do NOT appear here. Mirroring them
# would create a second copy that a local edit could quietly desynchronise
# while the shared digest still matched. The block above is the one deliberate
# exception, and it is documented there.
seed = 20260812
self_play_opponent = "thief"
auto_advance = false
step_delay_sec = 0.0

[network]
# EMPTY ON PURPOSE — the reserved domain lives in .env as NGROK_DOMAIN.
#
# 🐛 This used to hold a domain reserved on a different ngrok account, and
# `--tunnel` could not start at all: ERR_NGROK_320, "This domain is reserved for
# another account". Public exposure (M#10) was therefore unavailable and no
# league match could be played over the internet — invisible to every test we
# had, because localhost needs no tunnel.
#
# A reserved domain is bound to one account, which makes it a credential in
# everything but name. Empty here means the agent assigns a random URL, which
# `core/infra/tunnel.py` reads back rather than computes, so a fresh clone still
# plays. See `tunnel.reserved_domain`.
public_domain = ""
listen_host = "127.0.0.1"
listen_port = 8081
# Outbound messages a minute. Private, per-machine, and not negotiated: it
# describes what our tunnel can carry, not what the match agreed.
#
# MEASURED, not chosen. A free ngrok endpoint stops completing the TLS
# handshake at ~120 requests a minute; the client sees a bare ConnectError and
# the agent logs nothing, because the connection never becomes a request. Two
# peers with no human in the loop play ~1.4 steps a second at two messages a
# step — 168 a minute — and the 08/08 live rehearsal died mid-sub-game twice
# over, scoring 0 for both sides on a network budget rather than on any move.
# 100 leaves headroom at 0.6 s a message, against a 30 s response window.
max_calls_per_minute = 100
# ngrok | localtonet. See docs/PRD_5_tunnelling.md §6 for why ngrok is primary.
# Localtonet is the documented fallback for the day ngrok is blocked or down;
# switching is this line plus LOCALTONET_AUTHTOKEN in .env, no code change.
# Its argument form in core/infra/tunnel.py is unverified against a live
# account — confirm it before a graded match, not during one.
tunnel_provider = "ngrok"
# How long to wait for the opponent's FIRST turn after a sub-game's handshake
# settles. Private on purpose: a peer that restarts a process per sub-game needs
# ~2 minutes to rebind, and the 60 s signed watchdog cannot span that — but
# raising the SIGNED value to buy the wait edits the negotiated constitution and
# moves config_sha256 under an opponent who pinned it (imreeyal, 16/08). Waiting
# longer than the watchdog only ever costs us time, so it belongs here.
sub_game_patience_sec = 240

[strategy]
# See docs/PRD_strategy_advanced.md. These are ours alone; the opponent must
# never learn them, and nothing here may alter the rules of the game.
# Which brain a graded match fields (TODO 9.5.7). Private, so this is not part
# of the negotiated digest and the opponent never learns it. Left unset the
# loader falls back to `police.brain:PoliceBrain`, the baseline — which lost all
# six sub-games of the 08/08 self-rehearsal without ever making a capture.
police_class = "police.advanced:AdvancedCop"
# ⛔ **DEPTH 5 MEASURED AND NOT ADOPTED — the value below stays 3.** The sweep
# is real and is kept because it cost an hour to produce, but depth 5 FAILS our
# own integration suite: `tests/integration/test_match_driver.py` and
# `test_series_runner.py` both go red, almost certainly on the deadlines those
# tests drive real match loops against, since a depth-5 move is ~16x a depth-3
# one. Adopting it needs that understood and fixed first, not a config edit.
# Patch preserved out of tree; re-measure before taking it.
#
# The sweep, for whoever picks this up — 48 mirrored openings against our own advanced
# thief, one arm per depth, everything else at the shipped configuration:
#
#     depth 3 (was)   17/48 captures   320 walls    80 s
#     depth 4         15/48 captures   303 walls   324 s   <- WORSE than 3
#     depth 5         26/48 captures   331 walls  1295 s
#
# **Depth is not monotonic here, and 4 is the proof.** Anyone raising this by
# intuition would have stopped at 4, lost two captures and paid four times the
# compute for it. Re-measure rather than interpolate before changing it again.
#
# Affordable: 1295 s over 48 sub-games is ~27 s per sub-game, ~0.9 s per turn
# against the 30 s step deadline (A1.3) — and a cop turn is ~6 searches, because
# `barrier_policy` values every candidate placement with this same expectimax.
# Depth 6 measured 1.07 s for a *single* search in isolation, so ~6 s a turn,
# which is where the deadline starts to matter. 5 is the last comfortable rung.
#
# Private (Appendix F Table 22): not negotiated, not in the shared digest, and
# the opponent never learns it.
search_depth = 3
belief_prior = "uniform"
# Barriers are spent late, when the thief's exit count is small enough for a
# single wall to be lethal. Below this turn we herd rather than seal.
#
# SUPPRESSIVE ONLY. PRD_strategy_advanced A1.11 forbids transitions driven by
# turn number, so this key can hold us in HERD and can never by itself cause a
# placement; a measured ORBITER lifts it, because A1.12 needs barriers spent
# EARLIER against a thief that circles. See CONTRADICTIONS C-015. Measured
# across 16 openings the floor is currently inert — same captures, steps and
# barriers at 0 as at 8 — so it is kept as cheap insurance, not as a plan.
barrier_hold_until_turn = 8
# Refuse any barrier that would disconnect us from the thief's belief mass.
# Enforced in police/barrier_policy.py as a mass comparison rather than a
# geometric test, and judged on the mass that SURVIVES the placement: a wall
# that seals the thief's last exit strands a thief that is no longer there.
require_connectivity_to_target = true
# Phase thresholds (police/phases.py). All measured state, never the clock.
# Entropy of a uniform 7x7 is ~5.6 bits, so 3.5 is roughly "the mass has
# collapsed into about a dozen cells".
confident_bits = 3.5
# 4, not 3, and the reason is a deadlock found by measurement (5 self-play games,
# 175 turns, every one classified HERD, 0 of 14 barriers ever spent).
#
# On an empty 7x7 the thief's exit count is 4 in the interior, 3 on an edge and 2
# in a corner. At 3 the cop may only build once the thief is ALREADY on an edge —
# but the only thing that reduces a thief's exits is a wall, and walls are only
# placed outside HERD. So the cop waited for a confinement it was never allowed
# to create, and the thief strolled the full 35 steps.
#
# The old value rode on the comment below — that a greedy fleer corners itself
# against the board's own edges. Against `thief.advanced:AdvancedThief` it never
# did once in 175 turns, because avoiding corners is exactly what a good thief
# does. `strict` still lowers this to 3 against a measured greedy fleer, so the
# original caution survives where it is actually earned.
seal_exits = 4
squeeze_cells = 12
# Evaluation weights (police/evaluation.py). Separation dwarfs the rest on
# purpose: stranding the thief is not a weak position, it is a lost sub-game.
weight_separation = 400.0
weight_shared_region = 0.6
weight_proximity = 2.0
weight_endgame = 60.0
# 60, not 12, and measured rather than guessed. With 12 the Cop reached SEAL 35
# times in 5 games, `best_barrier` returned a legal wall all 35 times — and only
# 5 were built. Placing costs the turn (a placement moves as STAY) and its payoff
# lands 4+ moves out, past the 3-ply horizon, so expectimax compared a wall worth
# nothing it could see against a step that closed distance now. The step won 30
# times out of 35.
#
# Cycle removal is not one heuristic among several: every sub-game so far ended
# `thief survived 35 of 35`, which is precisely the signature this term names —
# "a region the Thief can circle is a region it survives in for all 35 steps
# however small it is" (police/barrier_policy.py). Breaking the cycle IS the
# Cop's win condition, so it is priced alongside `endgame` rather than an order
# of magnitude below it.
weight_cycle = 12.0
# 12, not 1.5. Raising `weight_cycle` first was the obvious move and it changed
# nothing, because `cycle` multiplies a BOOLEAN — it pays only for the wall that
# breaks the region's last cycle, which no single wall on an open 7x7 can do. So
# walls 1..n-1 earn zero and only the last collects, and the Cop never starts an
# investment whose whole return sits at the end. `reach` is the term that pays
# per cell removed, so it is the one that can reward the first wall at all.
weight_reach = 40.0
weight_diagonal = 2.0
# Cap on how many opponent traits we will profile, to stay unexploitable.
# Enforced: `core/domain/opponent_profile.TRAITS` is compared against this value
# by a test, so a fifth trait cannot be added without the cap being raised on
# purpose. See PRD_strategy_advanced A3.6 and CONTRADICTIONS C-016 for why flee
# and orbit count as one trait and not two.
max_profiled_traits = 4

# --- 8.3 unexploitable defaults --------------------------------------------
# How close two actions must score before the choice is drawn at random from
# the seeded generator in [game] seed (A3.1).
#
# 0.0 DISABLES the draw and restores the fixed search ordering, which is the
# exact control arm the 8.3.6 ablation measures against.
#
# SWEPT, NOT GUESSED. Captures out of 48 against our own advanced thief, over
# three seeds:
#
#     eps    0.0   0.05   0.1   0.25   0.5
#     mean  14.0   15.3  14.0   15.3  18.0
#
# The cop wants a WIDE window and the thief a narrow one (theirs is 0.1), which
# is not a contradiction: eps is in evaluation units and the two evaluations do
# not share a scale. The cop's is dominated by separation at 400 and capture at
# 1000, so moves within half a point really are interchangeable and shaking the
# pursuit line out of a deterministic groove finds captures. The thief's
# largest positional term is 2.0 per cell of room, so half a point there spans
# genuinely different moves.
tie_epsilon = 0.5

# --- 8.3 verbal layer -------------------------------------------------------
# Whether the brain may lie at all (A3.9). False pins every turn to saying
# nothing directional, and is the ablation's control arm.
#
# ON FOR THE COP: MEASURED, ADOPTED, RE-MEASURED. Leave-one-out from the
# shipped config over 48 openings against our own advanced thief: removing the
# verbal layer drops the cop from 8/48 captures to 2/48 — three quarters of
# everything phase 8.3 is worth, and the largest single effect in phase 8.
# A3.10 explains it: the lie's job is herding, and the cop is the role that
# herds. Figures re-measured 06/08 after the 4.1.6 scent-timing fix; the
# decision was the same before it.
bluff_enabled = true
# Information value at or below which the truth is free (A3.7, A3.8). Measured
# as 1 - how plainly our own scent field already announces the direction we are
# about to move in: a straight run leaves a decaying tail behind us and nothing
# ahead, so the bearing is already public and saying it costs nothing.
#
# 0.6 comes from the measured distribution, not from taste. Claiming the way we
# have actually been walking reads 1.00 after two steps, 0.69 after three, 0.54
# after four and 0.31 after six; a turn reads 0.74, a reversal and standing
# still both read 1.00. See core/domain/bluff.py.
cheap_truth = 0.60
# Measured hint-responsiveness at or below which we stop claiming a bearing at
# all (A3.12). Gated on a CONFIDENT reading — an unmeasured opponent is not a
# deaf one.
responsiveness_floor = 0.10

[trash_talk]
enabled = true
# Appendix F Table 21 defines four modes: template | ollama | claude_api |
# claude_cli. The choice is explicitly private to each peer, outside the agreed
# config and not negotiated. `groq` is our own fifth provider (ADR-003).
#
# The committed value is `template` — the book's own default. It costs zero
# tokens, needs no network inside the move loop, and works on any machine, so a
# fresh clone always runs. Override in .env, never here:
#   P2P_LLM_PROVIDER=ollama   local model, zero API tokens; needs ollama running
#   P2P_LLM_PROVIDER=groq     hosted and METERED — raise every_n_steps to 3
#
# ⚠️ ollama is only a better choice than template while it is actually up. If
# `localhost:11434` does not answer, every turn pays the provider timeout and
# then falls back to the bank anyway; `scripts/check_setup.py` reports whether
# it is reachable, and that check is worth running before a graded match.
#
# In template and ollama modes the whole 6-sub-game series runs at zero tokens
# and the contest reduces to movement-algorithm quality (Table 21) — which is
# where our expectimax and belief filtering live.
provider = "template"
# How often the MODEL runs - not how often a hint is sent. A hint goes out on
# every single turn regardless: it is part of the commit record together with
# the Intent flag (Ch. 5.3.1), so a turn without one would break commit-reveal.
# On the turns the model is skipped, the template writes the hint instead.
#
# The book frames this purely as a token-budget question (Ch. 6.5.1). Our two
# providers spend zero tokens - `template` calls no model at all and `ollama`
# is local, unmetered and rate-limit free - so there is no budget to protect
# and 1 costs us nothing while giving the richest verbal game.
#
# RAISE TO 3 IF the provider ever becomes metered (groq, claude_api,
# claude_cli). At 1 a 6-sub-game series makes 210 model calls instead of ~70;
# on a paid tier that is ~52k tokens and enough to brush the 5-hour message
# window of every subscription. Enforced by a startup check - see TODO 7.x.
every_n_steps = 1
# Truth is cheap and buys credibility; we lie only when the lie is decisive.
# See PRD_strategy_advanced.md §4.3.
default_truthfulness = "truthful"
max_words = 15
# Never fabricated, under any policy: capture claims, barrier placements,
# scent fields, game counts. Those are audited and score 0 for both teams.
never_fabricate = ["capture", "barriers", "scent", "game_count"]

[llm]
# Settings for whichever provider [trash_talk] selects. Keys and base URLs are
# read from .env (GROQ_API_KEY, OLLAMA_BASE_URL), never from this file.
groq_model = "llama-3.3-70b-versatile"
ollama_model = "llama3.1:8b"
# When the selected provider errors or is slow, degrade to `template` rather
# than forfeiting the turn on the watchdog. A dull sentence costs nothing;
# a timeout is a technical loss worth 0.
allow_template_fallback = true
max_output_tokens = 200
# Hard cap on time spent generating text, well inside the 30 s response limit.
timeout_sec = 8

[email]
# League reporting via the Gmail API, send-only scope (M#30).
enabled = true
sender = "itay.malich2@gmail.com"
# M#51. From config, never a literal in code: the test suite must not be able
# to mail the lecturer, and a changed address is a config edit not a release.
recipient = "rmisegal+uoh26finalgame@gmail.com"
send_on_series_end = true

[ui]
enabled = true
cell_pixels = 64
show_belief_heatmap = true

[logging]
level = "INFO"
results_dir = "results"
